{% set name = "python-geohash" %}
{% set version = "0.9.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz"
  sha256: "dd2da7eb381e0cd40cd2111590417b4f41e552c29167ac9b04d7523fdf3d21e4"

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python

about:
  home: "https://github.com/hkwi/python-geohash"
  license: Apache-2.0
  license_file: '{{ environ["RECIPE_DIR"] }}/LICENSE-2.0.txt'
  summary: "Fast, accurate python geohashing library"

extra:
  recipe-maintainers:
    - ceholden
